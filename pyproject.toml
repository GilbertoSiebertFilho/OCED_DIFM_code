[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oced-clean"
version = "0.1.0"
description = "OCED's raw-data yield cleaning (import as Ag Leader SMS, then the SMS 3-sigma sequence) as a library and a command line"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Olds College Smart Farm (OFPE)" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.9",
    "pyproj>=3.6",
    "scipy>=1.13",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
oced-clean = "oced_clean.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oced_clean = ["_engine/ENGINE_SOURCE.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
